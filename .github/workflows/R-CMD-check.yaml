# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Runs R CMD check against hard dependencies only (Depends/Imports/LinkingTo)
# plus testthat, since the Suggests list is large and mostly optional
# (WGCNA, mixOmics, clusterProfiler, STRINGdb, immunedeconv, ...). Only
# ERRORs fail the build — NOTEs/WARNINGs about missing optional packages
# are expected at this stage and don't block CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"NA"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
